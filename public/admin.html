<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game control</title><style>body{background:#10192a;color:#f7f1df;font:16px system-ui;margin:0}main{max-width:550px;margin:35px auto;padding:20px}h1,h2{color:#e9c879}input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;font-size:16px}input{background:#24334a;color:white;border:1px solid #46546a}button{background:#e9c879;color:#10192a;font-weight:bold;border:0}section{background:#1c2a3e;border:1px solid #3a4960;padding:18px;border-radius:14px;margin:15px 0}small{color:#bbc5d2}</style><main><h1>Game control</h1><p>For a trusted <b>non-playing</b> facilitator only. Players must not use this page.</p><section><h2>Access</h2><input id="key" type="password" placeholder="Admin key (20+ characters)"><button onclick="setup()">Set up admin key (first use)</button><button onclick="status()">Refresh status</button><small>Keep this key private. Do not share it with players.</small></section><section id="status">Waiting for connection.</section><section><h2>Game actions</h2><button onclick="action('start')">Emergency start (normally automatic)</button><button onclick="action('close')">Emergency close voting phase</button><button onclick="action('reveal')">Emergency reveal (after all votes)</button><small>These actions are permanent. Confirm timing with your group before clicking.</small></section><p id="msg"></p></main><script>const e=id=>document.getElementById(id);async function call(path,method='GET',body){const r=await fetch('/api/admin/'+path,{method,headers:{'Content-Type':'application/json','x-admin-key':e('key').value},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function message(t){e('msg').textContent=t}async function setup(){try{await call('setup','POST',{key:e('key').value});message('Admin key configured.');status()}catch(x){message(x.message)}}async function status(){try{const d=await call('status');e('status').textContent=`Registered: ${d.players.length}/12 | Started: ${d.started==='true'?'Yes':'No'} | Voting: ${d.closed==='true'?'Open':'Closed'} | Revealed: ${d.revealed==='true'?'Yes':'No'}. Players: ${d.players.map(p=>p.name).join(', ')||'none yet'}`}catch(x){message(x.message)}}async function action(a){if(!confirm('Confirm '+a+'?'))return;try{const d=await call(a,'POST');message(d.message||'Done.');status()}catch(x){message(x.message)}}</script></html>
