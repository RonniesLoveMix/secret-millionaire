<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10192a"><title>The Secret Millionaire</title><style>body{margin:0;background:#10192a;color:#f7f1df;font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:30px 20px}h1{font:700 2.4rem Georgia,serif;color:#e9c879}h2{color:#e9c879}input,select,button{box-sizing:border-box;width:100%;padding:15px;margin:8px 0;border-radius:10px;border:1px solid #46546a;font-size:16px}input,select{background:#24334a;color:white}button{background:#e9c879;color:#10192a;font-weight:800;cursor:pointer}.card{padding:18px;margin:14px 0;background:#1c2a3e;border:1px solid #3a4960;border-radius:14px}.muted{color:#bbc5d2}label{display:block;margin:12px 0}small{color:#c4cedb}.hide{display:none}.gold{color:#e9c879}</style><main><div class="gold">◆ PRIVATE WEEKEND GAME ◆</div><h1>THE SECRET<br>MILLIONAIRE</h1><p class="muted">Everyone has a secret. Someone has a fortune.</p><div id="login" class="card"><h2>Unlock your vault</h2><input id="phone" placeholder="Cellphone number" inputmode="tel"><input id="pin" placeholder="Private PIN (6–12 digits)" type="password" inputmode="numeric"><input id="name" placeholder="First name (for new players)"><input id="couple" placeholder="Couple label (optional, for registration)"><button onclick="go('login')">Sign in</button><button onclick="go('register')">Register</button><small>Use a private PIN, not your South African ID number.</small></div><div id="app"></div></main><script>
let token=sessionStorage.getItem('sm_token');const el=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function go(action){try{const d=await api(action,{phone:el('phone').value,pin:el('pin').value,name:el('name').value,couple:el('couple').value});token=d.token;sessionStorage.setItem('sm_token',token);render()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function render(){if(!token)return;try{const d=await api('me');el('login').classList.add('hide');let html='<div class="card"><h2>Welcome, '+esc(d.name)+'</h2>';if(!d.started)html+='<p>Your vault is sealed. Scheduled unlock: Thursday 22 October at 20:00 (South African time).</p>';else{html+='<p class="gold">CONFIDENTIAL IDENTITY</p><h2>'+esc(d.role)+'</h2><p>Keep your identity and missions private.</p></div><h2>Your five hidden agendas</h2>';d.missions.forEach((m,i)=>html+='<div class="card"><strong>Agenda '+(i+1)+'</strong><p>'+esc(m)+'</p><label><input style="width:auto" type="checkbox" '+(d.completed.includes(i)?'checked':'')+' '+(d.closed?'disabled':'')+' onchange="complete('+i+')"> Completed</label></div>');if(d.closed&&!d.revealed)html+='<div class="card"><h2>Final vote</h2><p>Who is the Secret Millionaire? Voting opens Saturday at 20:00. The reveal happens after everyone votes, or at 21:00.</p><select id="vote"><option value="">Choose a player</option>'+d.players.filter(p=>p.name!==d.name).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><button onclick="vote()">'+(d.voted?'Update vote':'Submit secret vote')+'</button></div>';if(d.revealed){const m=d.result.find(p=>p.role==='SECRET MILLIONAIRE');html+='<div class="card"><h2>THE GRAND REVEAL</h2><p>The Secret Millionaire is...</p><h1>'+esc(m.name)+'</h1><p>All missions completed: '+d.result.reduce((s,p)=>s+p.completed.length,0)+'</p></div>';}}html+='</div><button onclick="logout()">Sign out</button>';el('app').innerHTML=html;}catch(e){el('app').innerHTML='<p>'+esc(e.message)+'</p><button onclick="logout()">Sign in again</button>'}}async function complete(index){try{await api('complete',{index});render()}catch(e){alert(e.message)}}async function vote(){try{await api('vote',{id:Number(el('vote').value)});render()}catch(e){alert(e.message)}}function logout(){sessionStorage.removeItem('sm_token');location.reload()}render();setInterval(()=>{if(token)render()},60000);</script></html>
